name: alearning-microservice-dev
services:
  note-service:
    ports:
      - 3333:3333
    container_name: note-service
    networks:
      - dev-net
      - backend-dev
    image: alearning-note-service
    build:
      context: .
      dockerfile: note-service/Dockerfile
      target: dev
    depends_on:
      - note-service-db
    volumes:
      - ./note-service/:/app/note-service/
      - /app/note-service/node_modules/

  note-service-db:
    container_name: note-service-db
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_USER=alearning
      - MYSQL_PASSWORD=alearning
      - MYSQL_DATABASE=note_app
    networks:
      - backend-dev
    image: mysql:8.0

  auth-service-db:
    container_name: auth-service-db
    ports:
      - 8000:3306
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_USER=alearning
      - MYSQL_PASSWORD=alearning
      - MYSQL_DATABASE=auth_service
    networks:
      - backend-dev
    image: mysql:8.0
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "alearning", "-palearning" ]
      interval: 5s
      timeout: 5s
      retries: 10

  course-service-db:
    container_name: course-service-db
    image: postgres:16
    ports:
      - "8001:5432"
    environment:
      - POSTGRES_USER=alearning
      - POSTGRES_PASSWORD=alearning
      - POSTGRES_DB=course_service
    networks:
      - backend-dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U alearning -d course_service" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev-net:
  backend-dev: