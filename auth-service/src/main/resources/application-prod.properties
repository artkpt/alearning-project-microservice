spring.application.name=auth-service-prod

# 1. Database Configuration (รับค่าจาก Environment Variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:auth-service-db-prod}:${DB_PORT:3306}/${DB_NAME:auth_service}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# 2. ปิดการรัน SQL อัตโนมัติใน Production (ป้องกันข้อมูลจริงหาย)
spring.sql.init.mode=never

# 3. Security & JWT
app.security.jwt.token-max-interval-in-minute=60
app.security.jwt.key-id=${JWT_KEY_ID}
app.security.jwt.private-key-location=file:/app/private-key.pem

# เปลี่ยน localhost เป็นชื่อ Service ใน Docker หรือรับจาก ENV
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://auth-service:4000/.well-known/jwks.json}

# 4. ซ่อน Stacktrace ป้องกันการหลุดของข้อมูลระบบ
spring.web.error.include-stacktrace=never

server.port=4000